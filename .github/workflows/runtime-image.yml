# Builds the RUNTIME image (worker/Dockerfile.runtime, repo root as build context)
# and pushes ghcr.io/<owner>/image-studio-runtime:{latest,sha-<sha>}.
#
# The runtime image holds Python + torch (cu128) + ComfyUI + third-party deps
# only. Worker code (worker/src, shared/models.json) is fetched from GitHub by
# worker/boot/boot.py when a pod starts, so a code-only push builds NOTHING:
# the next pod start picks it up. This workflow runs only when the image
# itself changes (paths below) or by hand.
#
# Disk: the image is ~4.5 GB compressed (~9 GB unpacked, mostly torch + CUDA
# wheels), against ~14.8 GB for the legacy image. A standard runner usually
# fits it without the slow (~2.5 min) toolchain cleanup; the cleanup below runs
# only when the larger of / and /mnt has less than MIN_FREE_GB free. The df
# lines in the log show the real numbers for each run.
name: runtime-image

on:
  push:
    branches: [main]
    paths:
      - "worker/Dockerfile.runtime"
      - "worker/Dockerfile.runtime.dockerignore"
      - "worker/boot/**"
      - "worker/requirements-runtime.txt"
      - ".github/workflows/runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_FREE_GB: "30"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Disk before
        run: df -h / /mnt || df -h /

      - name: Free disk space (only if needed)
        run: |
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          best=$(( root_free > ${mnt_free:-0} ? root_free : ${mnt_free:-0} ))
          if [ "$best" -ge $(( MIN_FREE_GB * 1024 * 1024 )) ]; then
            echo "$(( best / 1024 / 1024 )) GB free on the larger disk: skipping cleanup"
            exit 0
          fi
          echo "Only $(( best / 1024 / 1024 )) GB free: removing preinstalled toolchains"
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google \
            /usr/lib/jvm /opt/az /usr/share/miniconda || true
          sudo docker image prune --all --force || true
          df -h / /mnt || df -h /

      - name: Move Docker data root to the larger disk
        run: |
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            echo "Using /mnt/docker (${mnt_free} KB free vs ${root_free} KB on /)"
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker /etc/docker
            [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
            sudo jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
            sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
            sudo systemctl start docker
            docker info --format 'Docker root: {{.DockerRootDir}}'
          else
            echo "Keeping Docker on / (${root_free} KB free)"
          fi

      - uses: actions/checkout@v4

      - name: Image name (lowercase owner)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/image-studio-runtime" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Inline cache: layer metadata travels inside the pushed image, so the
          # next build reuses unchanged layers (the torch layer especially).
          cache-from: type=registry,ref=${{ steps.img.outputs.name }}:latest
          cache-to: type=inline

      - name: Disk after
        if: always()
        run: df -h / /mnt || df -h /

      - name: Image size
        id: size
        run: |
          ref="${{ steps.img.outputs.name }}:sha-${{ github.sha }}"
          raw=$(docker buildx imagetools inspect --raw "$ref")
          # A single-platform push without provenance is a plain manifest; follow
          # the amd64 entry if it is an index.
          if echo "$raw" | jq -e '.manifests' >/dev/null; then
            digest=$(echo "$raw" | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest' | head -1)
            raw=$(docker buildx imagetools inspect --raw "${ref%:*}@${digest}")
          fi
          echo "$raw" | jq -r '.layers[] | "\(.size)\t\(.digest)"' | sort -rn \
            | awk -F'\t' '{printf "%8.1f MB  %s\n", $1/1e6, $2}'
          total=$(echo "$raw" | jq '[.layers[].size] | add')
          human=$(awk -v b="$total" 'BEGIN{printf "%.2f GB", b/1e9}')
          echo "Compressed size: $human ($total bytes, $(echo "$raw" | jq '.layers | length') layers)"
          echo "human=$human" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Runtime image pushed (${{ steps.size.outputs.human }} compressed)"
            echo '```'
            echo "${{ steps.img.outputs.name }}:latest"
            echo "${{ steps.img.outputs.name }}:sha-${{ github.sha }}"
            echo '```'
            echo "Pods fetch worker code at boot (WORKER_REF, default main); this image only changes when the runtime does."
          } >> "$GITHUB_STEP_SUMMARY"
