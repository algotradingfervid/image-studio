# Builds the RunPod worker image (worker/Dockerfile, repo root as build context)
# and pushes ghcr.io/<owner>/image-studio-worker:{latest,sha-<sha>}.
#
# Disk: the base image runpod/worker-comfyui:*-base is ~14.7 GB compressed
# (27 layers, the largest 6.7 GB), roughly 30+ GB unpacked. A standard runner
# has ~20-25 GB free on /, so this job deletes preinstalled toolchains and moves
# Docker's data root to whichever of / and /mnt has more space. The df output in
# the log shows the real numbers for each run.
# GHCR limits: 10 GB per layer, 10 minute timeout per layer upload.
# New GHCR packages are private: make it public once (see docs/setup.md).
name: worker-image

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "shared/**"
      - ".github/workflows/worker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Disk before
        run: df -h / /mnt || df -h /

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google \
            /usr/lib/jvm /opt/az /usr/share/miniconda || true
          sudo docker image prune --all --force || true
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile || true
          df -h / /mnt || df -h /

      - name: Move Docker data root to the larger disk
        run: |
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            echo "Using /mnt/docker (${mnt_free} KB free vs ${root_free} KB on /)"
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker /etc/docker
            [ -s /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
            sudo jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
            sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
            sudo systemctl start docker
            docker info --format 'Docker root: {{.DockerRootDir}}'
          else
            echo "Keeping Docker on / (${root_free} KB free)"
          fi

      - uses: actions/checkout@v4

      - name: Image name (lowercase owner)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/image-studio-worker" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disk after
        if: always()
        run: df -h / /mnt || df -h /

      - name: Summary
        run: |
          {
            echo "### Worker image pushed"
            echo '```'
            echo "${{ steps.img.outputs.name }}:latest"
            echo "${{ steps.img.outputs.name }}:sha-${{ github.sha }}"
            echo '```'
            echo "Deploy: \`python3 scripts/runpod_setup.py --apply --image ${{ steps.img.outputs.name }}:sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
