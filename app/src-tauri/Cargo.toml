[package]
name = "app"
version = "0.1.0"
description = "Image Studio"
authors = ["Naren"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
url = "2"
http = "1"
# Vault (spec v6): audited RustCrypto / dalek crates, exact versions pinned.
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc", "stream"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
zeroize = { version = "=1.9.1", features = ["zeroize_derive"] }

# macOS sleep / screen-lock / session hooks that lock the vault (spec v6).
# Same versions Tauri already pulls in (see Cargo.lock).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", features = ["block2", "NSDistributedNotificationCenter", "NSNotification", "NSObject", "NSOperation", "NSString"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSWorkspace"] }
block2 = "=0.6.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
